name: Build Bedrock Add-on

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path('behavior_pack').rglob('*.json')) + list(Path('resource_pack').rglob('*.json'))
          for path in files:
              with path.open(encoding='utf-8') as f:
                  json.load(f)
              print('OK:', path)
          PY

      - name: Package .mcaddon
        run: zip -r Shooting-Star-Bedrock.mcaddon behavior_pack resource_pack

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: shooting-star-bedrock-addon
          path: Shooting-Star-Bedrock.mcaddon
          if-no-files-found: error

      - name: Attach package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Shooting-Star-Bedrock.mcaddon
